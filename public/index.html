<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Catálogo de Videojuegos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%236366f1%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head> 
<body>
  <header class="topbar">
    <a href="#/" class="logo"><span class="logo-dot"></span>Catálogo</a>
    <nav id="crumbs" class="crumbs"></nav>
  </header>

  <main id="view"></main>

  <!-- Vista de detalle (caja abierta) -->
  <div id="detail" class="detail" hidden></div>

  <!-- Visor de fotos -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="Cerrar"><i data-icon="close"></i></button>
    <button class="lb-nav prev" aria-label="Anterior"><i data-icon="chevron-left"></i></button>
    <figure><img alt="" /><figcaption></figcaption></figure>
    <button class="lb-nav next" aria-label="Siguiente"><i data-icon="chevron-right"></i></button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/js/shared.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
